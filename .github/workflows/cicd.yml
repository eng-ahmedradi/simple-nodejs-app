name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install
      - run: npm pack

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '20'
        with:
          name: app
          path: "*.tgz"

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app

      - run: docker build -t ahmedradii/simple-nodejs-app:latest .
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker push ahmedradii/simple-nodejs-app:latest

  deploy:
    needs: docker
    runs-on: self-hosted
    environment: production

    steps:
      - run: |
          docker pull ahmedradii/simple-nodejs-app:latest
          docker stop nodejs-app || true
          docker rm nodejs-app || true
          docker run -d -p 3000:3000 --name nodejs-app ahmedradii/simple-nodejs-app:latest
